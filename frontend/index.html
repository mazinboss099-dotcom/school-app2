<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة أبوذر الكودة</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 80px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #0d6efd;
            margin-bottom: 10px;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .download-btn {
            display: inline-block;
            background-color: #0d6efd;
            color: #ffffff;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
        }
        .download-btn:hover {
            background-color: #0b5ed7;
        }
        .note {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #adb5bd;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مدرسة أبوذر الكودة</h1>
        <p>مرحباً بك في البوابة الإلكترونية وتطبيق المدرسة الرسمي.</p>
        
        <!-- زر التثبيت بالنص النظيف الذي طلبته -->
        <a href="/مدرسة أبوذر.apk" class="download-btn" download>📥 تثبيت التطبيق</a>

        <div class="note">
            مستخدمو أجهزة آيفون يمكنهم إضافة الموقع إلى الشاشة الرئيسية من خيارات المتصفح.
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js');
            });
        }
    </script>
</body>
</html>
