<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة أبوذر الكودة</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    
    <!-- كود التحويل التلقائي إذا فتح التطبيق وهو مثبت بالفعل في وضع Standalone -->
    <script>
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            window.location.replace('/app.html');
        }
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 80px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #0d6efd;
            margin-bottom: 10px;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        /* زر التثبيت الحقيقي */
        #install-btn {
            display: none; /* مخفي لحين جاهزية المتصفح للتثبيت */
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            margin: 0 auto;
        }
        #install-btn:hover {
            background-color: #0b5ed7;
        }
        .note {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #adb5bd;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مدرسة أبوذر الكودة</h1>
        <p>مرحباً بك في البوابة الإلكترونية وتطبيق المدرسة الرسمي.</p>
        
        <!-- زر تثبيت التطبيق الذكي -->
        <button id="install-btn">📥 تثبيت التطبيق</button>

        <div class="note" id="install-note">
            إذا لم يظهر زر التثبيت، يمكنك تثبيت التطبيق يدويًا من قائمة المتصفح (النقاط الثلاثة) واختيار "إضافة إلى الشاشة الرئيسية" أو "تثبيت التطبيق".
        </div>
    </div>

    <!-- كود تفعيل زر التثبيت الرسمي للـ PWA -->
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // منع المتصفح من إظهار النافذة تلقائياً
            e.preventDefault();
            deferredPrompt = e;
            // إظهار زر التثبيت الخاص بنا
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // إظهار نافذة التثبيت الرسمية للنظام
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('المستخدم وافق على تثبيت التطبيق');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        // تسجيل الـ Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js');
            });
        }
    </script>
</body>
</html>
