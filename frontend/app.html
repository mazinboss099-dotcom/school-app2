<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مدرسة أبوذر الكودة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 15px 30px;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .admin-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .admin-btn:hover {
            background-color: #5a6268;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h1 {
            color: #0d6efd;
            margin-bottom: 10px;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .role-btn {
            background-color: #e9ecef;
            color: #333;
            padding: 15px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .role-btn:hover {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي للإدارة -->
    <div class="top-bar">
        <button class="admin-btn" onclick="openAdminLogin()">⚙️ دخول الإدارة</button>
    </div>

    <div class="container">
        <h1>مدرسة أبوذر الكودة</h1>
        <p>يرجى اختيار نوع الحساب للمتابعة:</p>
        
        <div class="role-buttons">
            <a href="register.html?role=student" class="role-btn">👨‍🎓 تسجيل طالب جديد</a>
            <a href="register.html?role=teacher" class="role-btn">👨‍🏫 تسجيل أستاذ جديد</a>
            <a href="register.html?role=supervisor" class="role-btn">🛡️ تسجيل مشرف جديد</a>
        </div>
    </div>

    <script>
        function openAdminLogin() {
            let password = prompt("الرجاء إدخال كلمة سر لوحة التحكم:");
            if (password === "admin123") {
                window.location.href = "admin.html";
            } else if (password !== null) {
                alert("كلمة السر غير صحيحة!");
            }
        }
    </script>
</body>
</html>
